<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Finder</title>
<meta name="description" content="Find 3D-printable models — searches run on Storm's laptop">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prints">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef0f3; --border: #dde1e6; --text: #1c1f24; --dim: #6b7280;
  --accent: #3d6cf0; --accent-text: #ffffff; --good: #1a9e5c; --bad: #d3452b; --paid: #b8860b; --heart: #e5484d;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 12px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181d; --panel: #1e2127; --panel-2: #262a32; --border: #33383f; --text: #e7e9ec; --dim: #9aa1ab;
    --accent: #5b84ff; --accent-text: #0d1117; --good: #35c481; --bad: #ff6b52; --paid: #e0ac3c; --heart: #ff5c63;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #16181d; --panel: #1e2127; --panel-2: #262a32; --border: #33383f; --text: #e7e9ec; --dim: #9aa1ab;
  --accent: #5b84ff; --accent-text: #0d1117; --good: #35c481; --bad: #ff6b52; --paid: #e0ac3c; --heart: #ff5c63;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
.hidden { display: none !important; }
input, textarea { font: inherit; font-size: 16px; color: var(--text); }

header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); padding: 10px 12px 8px; }
.bar { display: flex; align-items: center; gap: 4px; }
.bar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; margin-right: auto; }
.bar .brand img { width: 26px; height: 26px; border-radius: 7px; }
.ib { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; position: relative; color: var(--dim); }
.ib:active { background: var(--panel-2); }
.ib .n { position: absolute; top: 4px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px; font-size: 10px; font-weight: 700;
  line-height: 16px; background: var(--heart); color: #fff; }
.q { display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  padding: 6px 6px 6px 12px; box-shadow: var(--shadow); }
.q textarea { flex: 1; border: 0; outline: 0; background: none; resize: none; min-height: 24px; max-height: 120px; padding: 5px 0; }
.go { width: 38px; height: 38px; border-radius: 12px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.go:disabled { opacity: .4; }

#state { padding: 6px 12px 0; }
.sites { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; }
.sites::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--panel);
  border: 1px solid var(--border); font-size: 12.5px; color: var(--dim); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 650; }
.chip.done b { color: var(--good); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.chip.running .dot { background: var(--accent); animation: pulse 1s infinite alternate; }
.chip.done .dot { background: var(--good); }
.chip.error .dot { background: var(--bad); }
@keyframes pulse { to { opacity: .3; } }
.msg { font-size: 13px; color: var(--dim); padding: 2px 2px 6px; display: flex; gap: 8px; align-items: center; }
.msg.warn { color: var(--bad); }
.spin { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.plan { font-size: 12.5px; color: var(--dim); padding: 0 2px 6px; }
.plan b { color: var(--text); font-weight: 600; }
.refine { display: flex; gap: 6px; margin: 2px 0 8px; }
.refine input { flex: 1; min-width: 0; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); padding: 0 10px; font-size: 16px; }
.refine button { height: 36px; padding: 0 12px; border-radius: 10px; background: var(--panel-2); font-size: 13.5px; font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 4px 12px 30px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; text-align: left; display: flex;
  flex-direction: column; box-shadow: var(--shadow); position: relative; }
.card .img { aspect-ratio: 1; background: var(--panel-2) center/cover no-repeat; }
.card .t { padding: 7px 9px 2px; font-size: 13.5px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.card .m { padding: 2px 9px 8px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); margin-top: auto; }
.score { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.score.hi { color: var(--good); }
.heart { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center;
  background: rgba(0,0,0,.32); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.heart.on { color: var(--heart); background: rgba(255,255,255,.9); }
.heart.on svg { fill: currentColor; }
.price { font-weight: 600; }
.price.free { color: var(--good); }
.price.paid { color: var(--paid); }
.empty { text-align: center; color: var(--dim); padding: 40px 30px; }
.more { display: block; margin: 0 auto 30px; padding: 10px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); font-weight: 600; }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.3); opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; max-height: 92vh; overflow-y: auto; background: var(--bg);
  border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1);
  padding-bottom: calc(16px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sheet.on { transform: none; }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--border); margin: 8px auto 2px; }
.sheet h2 { margin: 6px 16px 10px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.sheet h2 .x { margin-left: auto; }
.list { margin: 0 12px; background: var(--panel); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
.li { display: flex; align-items: center; gap: 10px; padding: 11px 12px; width: 100%; text-align: left; }
.li + .li { border-top: 1px solid var(--border); }
.li .tx { flex: 1; min-width: 0; }
.li .tx small { display: block; color: var(--dim); font-size: 12px; margin-top: 1px; }
.li .del { color: var(--dim); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; }
.pill { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--panel-2); color: var(--dim); text-transform: uppercase; letter-spacing: .03em; }
.pill.active { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }

/* detail */
.gal { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0; background: var(--panel-2); scrollbar-width: none; }
.gal::-webkit-scrollbar { display: none; }
.gal img, .gal video, .gal iframe { flex: none; width: 100%; aspect-ratio: 1; object-fit: contain; scroll-snap-align: center; background: var(--panel-2); border: 0; }
.dots { display: flex; justify-content: center; gap: 5px; padding: 8px 0 0; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--border); }
.dots i.on { background: var(--accent); width: 14px; }
.d-body { padding: 10px 16px; }
.d-body h3 { margin: 4px 0 6px; font-size: 19px; line-height: 1.25; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--dim); font-size: 13px; align-items: center; }
.why { margin: 10px 0; padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); font-size: 13.5px; }
.why b { color: var(--accent); }
.acts { display: flex; gap: 8px; margin: 12px 0; }
.acts a, .acts button { height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 650; }
.acts .open { flex: 1; background: var(--accent); color: var(--accent-text); text-decoration: none; }
.acts .sq { width: 48px; background: var(--panel); border: 1px solid var(--border); }
.acts .sq.on { color: var(--heart); }
.acts .sq.on svg { fill: currentColor; }
.acts .sq.up.on { color: var(--good); }
.acts .sq.down.on { color: var(--bad); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tags span { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); color: var(--dim); }
.desc { white-space: pre-wrap; font-size: 14px; color: var(--text); max-height: 11em; overflow: hidden; position: relative; }
.desc.open { max-height: none; }
.desc-more { color: var(--accent); font-weight: 600; font-size: 14px; margin-top: 4px; }

/* connect */
#connect { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 16vh 30px 30px; }
#connect img { width: 84px; height: 84px; border-radius: 20px; box-shadow: var(--shadow); }
#connect h1 { margin: 4px 0 0; font-size: 24px; }
#connect p { margin: 0; color: var(--dim); max-width: 320px; }
#connect input { width: 100%; max-width: 320px; height: 46px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel); text-align: center; }
.btn { height: 46px; padding: 0 24px; border-radius: 23px; background: var(--accent); color: var(--accent-text); font-weight: 650; min-width: 200px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 30;
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0; transition: .25s; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>

<section id="connect" class="hidden">
  <img src="icon-180.png" alt="">
  <h1>Print Finder</h1>
  <p>Searches run on Storm's laptop; your saved models and history come along. Connect once to the Dropbox they live in.</p>
  <button class="btn" id="go-auth">Connect Dropbox</button>
  <div id="code-step" class="hidden" style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%">
    <p>Tap <b>Allow</b>, copy the code Dropbox shows, paste it here.</p>
    <input id="code" placeholder="Paste code" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="finish-auth">Done</button>
  </div>
  <p id="auth-err" style="color:var(--bad)"></p>
</section>

<main id="app" class="hidden">
  <header>
    <div class="bar">
      <div class="brand"><img src="icon-180.png" alt="">Print Finder</div>
      <button class="ib" id="b-saved" aria-label="Saved"><svg class="i"><use href="#i-heart"/></svg><span class="n hidden" id="n-saved"></span></button>
      <button class="ib" id="b-hist" aria-label="History"><svg class="i"><use href="#i-hist"/></svg></button>
      <button class="ib" id="b-learn" aria-label="What it's learned"><svg class="i"><use href="#i-brain"/></svg></button>
    </div>
    <form class="q" id="qf">
      <textarea id="q" rows="1" placeholder="Describe what you want to print…" enterkeyhint="search"></textarea>
      <button class="go" id="go" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
    </form>
  </header>
  <div id="state"></div>
  <div id="results"></div>
</main>

<div class="toast" id="toast"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></symbol>
  <symbol id="i-hist" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3.5 4.5v4.5H8"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 4.5a3 3 0 0 0-3 3 3 3 0 0 0-1.5 5.6A3 3 0 0 0 9 18.5V4.5zM15 4.5a3 3 0 0 1 3 3 3 3 0 0 1 1.5 5.6A3 3 0 0 1 15 18.5V4.5zM9 19.5h6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M7 21V10l4-7c1.5 0 2.5 1 2.2 2.6L12.7 9H18a2 2 0 0 1 2 2.3l-1.3 7.5A2.5 2.5 0 0 1 16.3 21H7zM7 10H4v11h3"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M7 3v11l4 7c1.5 0 2.5-1 2.2-2.6L12.7 15H18a2 2 0 0 0 2-2.3l-1.3-7.5A2.5 2.5 0 0 0 16.3 3H7zM7 14H4V3h3"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></symbol>
</svg>

<script src="app.js"></script>
</body>
</html>
